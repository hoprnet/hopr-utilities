[package]
authors      = ["HOPR Association <tech@hoprnet.org>"]
categories   = ["asynchronous", "network-programming"]
description  = "Shared utility crates for HOPR: async runtime, network types, parallelisation, statistics, platform, and testing helpers"
edition      = "2024"
homepage     = "https://hoprnet.org/"
include      = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]
keywords     = ["hopr", "async", "utilities"]
license      = "GPL-3.0-only"
name         = "hopr-utilities"
readme       = "README.md"
repository   = "https://github.com/hoprnet/hopr-utilities"
rust-version = "1.91"
version      = "0.4.0"

[lib]
crate-type = ["rlib"]

[features]
default = []

# runtime module (from hopr-async-runtime) — always compiled, feature gates optional deps only
runtime-tokio = ["dep:tokio", "dep:tracing"]
async-lock    = ["dep:async-lock"]

# network-types module (from hopr-network-types)
network-types = [
  "dep:crossfire",
  "dep:arrayvec",
  "dep:flume",
  "dep:futures-time",
  "dep:hickory-resolver",
  "dep:libp2p-identity",
  "dep:multiaddr",
  "dep:pin-project",
  "dep:socket2",
  "dep:strum",
  "dep:thiserror",
  "dep:tracing",
  "dep:lazy_static",
  "hopr-types/crypto",
]
serde                       = ["dep:serde", "dep:serde_bytes", "hopr-types/serde"]
network-types-serde         = ["network-types", "serde", "libp2p-identity/serde"]
network-types-capture       = ["network-types", "dep:pcap-file"]
network-types-runtime-tokio = [
  "network-types",
  "runtime-tokio",
  "dep:tokio-util",
  "hickory-resolver/tokio",
]
telemetry               = ["hopr-types/telemetry"]
network-types-telemetry = ["network-types", "telemetry"]

# parallelize module (from hopr-parallelize)
parallelize               = ["dep:thiserror", "dep:tracing", "dep:lazy_static", "dep:libc"]
parallelize-rayon         = ["parallelize", "dep:rayon"]
parallelize-runtime-tokio = ["parallelize", "runtime-tokio"]
parallelize-telemetry     = ["parallelize", "telemetry"]

# statistics module (from hopr-statistics)
statistics-types          = []
statistics-types-serde    = ["statistics-types", "dep:serde"]
statistics-types-moving   = ["statistics-types"]
statistics-types-weighted = ["statistics-types", "dep:rand"]

# platform module (from hopr-platform)
platform              = ["dep:thiserror"]
platform-trace-timing = ["platform", "dep:tracing"]

[dependencies]
# runtime (always-on baseline)
auto_impl  = { workspace = true }
async-lock = { workspace = true, optional = true }
indexmap   = { workspace = true }
futures    = { workspace = true }
tokio      = { workspace = true, optional = true, features = ["time", "sync"] }

crossfire = { workspace = true, optional = true }

# network-types
arrayvec         = { workspace = true, optional = true }
flume            = { workspace = true, optional = true }
futures-time     = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
libp2p-identity  = { workspace = true, optional = true }
multiaddr        = { workspace = true, optional = true }
pin-project      = { workspace = true, optional = true }
pcap-file        = { workspace = true, optional = true }
socket2          = { workspace = true, features = ["all"], optional = true }
strum            = { workspace = true, optional = true }
tokio-util       = { workspace = true, optional = true, features = ["net", "io"] }

# network-types-serde
serde       = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }

# parallelize
rayon = { workspace = true, optional = true }

# statistics-types-weighted
rand = { workspace = true, optional = true }

# platform + parallelize (shared)
thiserror = { workspace = true, optional = true }
tracing   = { workspace = true, optional = true }

# shared across network-types and parallelize
lazy_static = { workspace = true, optional = true }

# network-types-serde + telemetry
hopr-types = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
anyhow        = { workspace = true }
assertables   = { workspace = true }
parameterized = { workspace = true }
serial_test   = { workspace = true }
tokio         = { workspace = true, features = ["rt", "macros", "time"] }
test-log      = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["serde_bytes"]

[package.metadata.cargo-machete]
ignored = ["hickory-resolver", "serde_bytes"]

[workspace]
resolver = "3"

[workspace.dependencies]
# --- external crates ---
anyhow        = "1.0.103"
arrayvec      = "0.7.7"
assertables   = "10.1.0"
async-lock    = "3.4.2"
auto_impl     = "1.3.0"
crossfire     = { version = "3.1.18", default-features = false }
flume         = { version = "0.12.0", default-features = false, features = ["async"] }
futures       = { version = "0.3.32", default-features = false, features = [
  "std",
  "async-await",
] }
futures-time     = "3.1.0"
hickory-resolver = { version = "0.26.1", default-features = false, features = [
  "system-config",
] }
indexmap        = "2.14.0"
lazy_static     = "1.5.0"
libc            = "0.2"
libp2p-identity = { version = "0.2.14", features = [
  "peerid",
  "ed25519",
  "rand",
] }
multiaddr     = "0.18.2"
parameterized = "2.0.0"
pcap-file     = "2.0.0"
pin-project   = "1.1.13"
rand          = { version = "0.10.1", features = ["thread_rng"] }
rayon         = "1.12.0"
serde         = { version = "1.0.228", features = ["derive"] }
serde_bytes   = "0.11.19"
serial_test   = "3.5.0"
socket2       = "0.6.4"
strum         = { version = "0.28.0", features = ["derive"] }
test-log      = { version = "0.2.21", features = ["trace"] }
thiserror     = "2.0.18"
tokio         = { version = "1.52.3", features = [
  "rt-multi-thread",
  "macros",
  "tracing",
] }
tokio-util = { version = "0.7.18", default-features = false, features = [
  "codec",
  "compat",
] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }

# --- HOPR crates (crates.io) ---
hopr-types = { version = "2.0.2", features = ["use-bindings"] }
