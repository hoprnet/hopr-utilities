[package]
authors      = ["HOPR Association <tech@hoprnet.org>"]
categories   = ["asynchronous", "network-programming"]
description  = "Shared utility crates for HOPR: async runtime, network types, parallelisation, statistics, platform, and testing helpers"
edition      = "2024"
homepage     = "https://hoprnet.org/"
include      = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]
keywords     = ["async", "hopr", "utilities"]
license      = "GPL-3.0-only"
name         = "hopr-utilities"
readme       = "README.md"
repository   = "https://github.com/hoprnet/hopr-utilities"
rust-version = "1.97"
version      = "0.9.0"

[lints.rust]
# `tokio_unstable` gates the cooperative-yield (`tokio::task::coop`) code paths; declare it so the
# default `unexpected_cfgs` lint does not flag the `#[cfg(tokio_unstable)]` guards.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lib]
crate-type = ["rlib"]

[features]
default = []

# runtime module (from hopr-async-runtime) — always compiled, feature gates optional deps only
async-lock    = ["dep:async-lock"]
runtime-tokio = ["dep:tokio", "dep:tracing"]

# network-types module (from hopr-network-types)
network-types = [
  "dep:arrayvec",
  "dep:crossfire",
  "dep:flume",
  "dep:futures-time",
  "dep:hickory-resolver",
  "dep:lazy_static",
  "dep:libp2p-identity",
  "dep:multiaddr",
  "dep:pin-project",
  "dep:socket2",
  "dep:strum",
  "dep:thiserror",
  "dep:tracing",
  "hopr-types/network",
]
network-types-capture = ["dep:pcap-file", "network-types"]
network-types-runtime-tokio = [
  "dep:tokio-util",
  "hickory-resolver/tokio",
  "network-types",
  "runtime-tokio",
]
network-types-serde = ["libp2p-identity/serde", "network-types", "serde"]
network-types-telemetry = ["network-types", "telemetry"]
serde = ["dep:serde", "dep:serde_bytes", "hopr-types/serde"]
telemetry = ["hopr-types/telemetry"]

# parallelize module (from hopr-parallelize)
parallelize               = ["dep:lazy_static", "dep:libc", "dep:thiserror", "dep:tracing"]
parallelize-rayon         = ["dep:rayon", "parallelize"]
parallelize-runtime-tokio = ["parallelize", "runtime-tokio"]
parallelize-telemetry     = ["parallelize", "telemetry"]

# statistics module (from hopr-statistics)
statistics-types          = []
statistics-types-moving   = ["statistics-types"]
statistics-types-serde    = ["dep:serde", "statistics-types"]
statistics-types-weighted = ["dep:rand", "statistics-types"]

# platform module (from hopr-platform)
platform              = ["dep:thiserror"]
platform-trace-timing = ["dep:tracing", "platform"]

# Blokli testing utilities (emulator)
testing-blokli = [
  "blokli-client/serde",
  "blokli-client/testing",
  "dep:anyhow",
  "dep:blokli-client",
  "dep:hopr-api",
]

[dependencies]
anyhow = { workspace = true, optional = true }
# runtime (always-on baseline)
async-lock    = { workspace = true, optional = true }
auto_impl     = { workspace = true }
blokli-client = { workspace = true, optional = true }
futures       = { workspace = true }
indexmap      = { workspace = true }
tokio         = { workspace = true, optional = true, features = ["sync", "time"] }

crossfire = { workspace = true, optional = true }

# network-types
arrayvec         = { workspace = true, optional = true }
flume            = { workspace = true, optional = true }
futures-time     = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
libp2p-identity  = { workspace = true, optional = true }
multiaddr        = { workspace = true, optional = true }
pcap-file        = { workspace = true, optional = true }
pin-project      = { workspace = true, optional = true }
socket2          = { workspace = true, features = ["all"], optional = true }
strum            = { workspace = true, optional = true }
tokio-util       = { workspace = true, optional = true, features = ["io", "net"] }

# network-types-serde
serde       = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }

# parallelize
rayon = { workspace = true, optional = true }

# statistics-types-weighted
rand = { workspace = true, optional = true }

# platform + parallelize (shared)
thiserror = { workspace = true, optional = true }
tracing   = { workspace = true, optional = true }

# shared across network-types and parallelize
lazy_static = { workspace = true, optional = true }

# network-types-serde + telemetry
const-hex  = "1.19.1"
hopr-api   = { workspace = true, optional = true }
hopr-types = { workspace = true, optional = true }
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
anyhow        = { workspace = true }
assertables   = { workspace = true }
parameterized = { workspace = true }
serial_test   = { workspace = true }
test-log      = { workspace = true }
tokio         = { workspace = true, features = ["macros", "rt", "time"] }

[package.metadata.cargo-shear]
ignored = ["serde_bytes"]

[package.metadata.cargo-machete]
ignored = ["hickory-resolver", "serde_bytes"]

[workspace]
resolver = "3"

[workspace.dependencies]
# --- external crates ---
anyhow = "1.0.103"
arrayvec = "0.7.7"
assertables = "10.1.0"
async-lock = "3.4.2"
auto_impl = "1.3.0"
blokli-client = "0.31.0"
crossfire = { version = "3.1.18", default-features = false }
flume = { version = "0.12.0", default-features = false, features = ["async"] }
futures = { version = "0.3.32", default-features = false, features = [
  "async-await",
  "std",
] }
futures-time = "3.1.0"
hickory-resolver = { version = "0.26.1", default-features = false, features = [
  "system-config",
] }
indexmap = "2.14.0"
lazy_static = "1.5.0"
libc = "0.2"
libp2p-identity = { version = "0.2.14", features = [
  "ed25519",
  "peerid",
  "rand",
] }
multiaddr = "0.18.2"
parameterized = "2.0.0"
pcap-file = "2.0.0"
pin-project = "1.1.13"
rand = { version = "0.10.1", features = ["thread_rng"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serial_test = "3.5.0"
socket2 = "0.6.4"
strum = { version = "0.28.0", features = ["derive"] }
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
  "macros",
  "rt-multi-thread",
  "tracing",
] }
tokio-util = { version = "0.7.18", default-features = false, features = [
  "codec",
  "compat",
] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }

# --- HOPR crates (crates.io) ---
# TEMPORARY: pinned to the unreleased hopr-api 2.0.0 branch to verify this bump compiles.
#
# `version` alongside `git` is the "multiple locations" form: the git source wins locally, while
# packaging keeps the version requirement and drops the git specification. Without it, cargo refuses
# to normalise the manifest at all ("all dependencies must have a version requirement specified when
# packaging"). The publish dry-run still fails until hopr-api 2.0.0 reaches crates.io, but on the
# resolution step rather than on the manifest.
hopr-api = { version = "2.0.0", git = "https://github.com/hoprnet/hopr-api", rev = "ee65b340cf09fd6031735477cc1171d7610694a3", features = [
  "chain",
] }
hopr-types = { version = "2.3.0", features = ["use-bindings"] }
