---
name: Merge
on:
  pull_request:
    types:
      - closed
    branches:
      - main
concurrency:
  group: merge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  build-library:
    name: Library ${{ matrix.architecture }}
    if: github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-4
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-arm-4
          - architecture: aarch64-darwin
            runner: depot-macos-15
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # build-library-v4.0.0
    permissions:
      contents: read
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.merge_commit_sha }}
      version_type: pr
      architecture: ${{ matrix.architecture }}
      build_file: Cargo.toml
      package_name: hopr-utilities
      runner: ${{ matrix.runner }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  notify:
    name: Notify failure
    needs:
      - build-library
    if: ${{ always() && github.event.pull_request.merged == true && !success() }}
    runs-on: depot-ubuntu-24.04-2
    permissions: {}
    steps:
      - name: Notify failed merge pipeline
        uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ${{ secrets.ZULIP_EMAIL }}
          organization-url: "https://hopr.zulipchat.com"
          type: "stream"
          to: "hopr-utilities"
          topic: "main"
          content: |
            The merge pipeline has failed for pull request [#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
